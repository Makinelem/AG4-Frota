<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manutenção | Frota AG4</title>
  <link rel="stylesheet" href="css/veic.css">
  <link rel="stylesheet" href="css/manut.css">
  <script src="js/manut.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="app-brand" href="app.html" aria-label="Frota AG4 - Início">
      <img src="img/logo.png" alt="Frota AG4" class="app-logo">
    </a>
    <div class="user-area">
      <span id="userInfo"></span>
      <button id="logoutButton" class="logout-button" type="button">Sair</button>
    </div>
  </header>

  <main class="content">
    <div class="page-heading">
      <div>
        <p class="eyebrow">GESTÃO DA FROTA</p>
        <h1>Manutenção</h1>
        <p class="subtitle">Registre e acompanhe os serviços dos veículos.</p>
      </div>
      <button id="openFormButton" class="primary-button" type="button">
        + Registrar manutenção
      </button>
    </div>

    <p id="feedback" class="feedback" role="status"></p>
    <section id="maintenanceList" class="vehicle-list"
             aria-label="Lista de manutenções"></section>
    <p id="emptyMessage" class="empty-message" hidden>
      Nenhuma manutenção cadastrada.
    </p>
  </main>

  <nav class="bottom-nav" id="bottomNav" aria-label="Navegação principal"></nav>

  <dialog id="maintenanceDialog" class="dialog">
    <form id="maintenanceForm" class="dialog-card">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">FROTA AG4</p>
          <h2>Registrar manutenção</h2>
        </div>
        <button id="closeFormButton" class="icon-button" type="button"
                aria-label="Fechar">×</button>
      </div>

      <label for="vehicleId">Veículo</label>
      <select id="vehicleId" name="vehicleId" required></select>

      <label for="date">Data</label>
      <input id="date" name="date" type="date" required>

      <label for="odometer">Quilometragem</label>
      <input id="odometer" name="odometer" type="number" min="0" step="1" required>

      <label for="service">Serviço realizado</label>
      <textarea id="service" name="service" rows="3" maxlength="500" required></textarea>

      <label for="cost">Custo (R$)</label>
      <input id="cost" name="cost" type="number" min="0" step="0.01" value="0" required>

      <label for="status">Status</label>
      <select id="status" name="status" required>
        <option value="Concluída">Concluída</option>
        <option value="Pendente">Pendente</option>
      </select>

      <p id="formError" class="error-message" role="alert"></p>

      <div class="dialog-actions">
        <button id="cancelFormButton" class="secondary-button" type="button">
          Cancelar
        </button>
        <button class="primary-button" type="submit">Salvar manutenção</button>
      </div>
    </form>
  </dialog>
</body>
</html>
