<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estoque | Frota AG4</title>
  <link rel="stylesheet" href="css/veic.css">
  <link rel="stylesheet" href="css/est.css">
  <script src="js/est.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="app-brand" href="app.html" aria-label="Frota AG4 - Início">
      <img src="img/logo.png" alt="Frota AG4" class="app-logo">
    </a>
    <div class="user-area">
      <span id="userInfo"></span>
      <button id="logoutButton" class="logout-button" type="button">Sair</button>
    </div>
  </header>

  <main class="content">
    <div class="page-heading">
      <div>
        <p class="eyebrow">GESTÃO DA FROTA</p>
        <h1>Estoque</h1>
        <p class="subtitle">Cadastre peças e acompanhe as quantidades disponíveis.</p>
      </div>
      <button id="openFormButton" class="primary-button" type="button">
        + Cadastrar item
      </button>
    </div>

    <p id="feedback" class="feedback" role="status"></p>

    <section id="stockList" class="vehicle-list" aria-label="Itens em estoque"></section>

    <p id="emptyMessage" class="empty-message" hidden>
      Nenhum item cadastrado no estoque.
    </p>
  </main>

  <nav class="bottom-nav" id="bottomNav" aria-label="Navegação principal"></nav>

  <dialog id="stockDialog" class="dialog">
    <form id="stockForm" class="dialog-card">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">FROTA AG4</p>
          <h2>Cadastrar item</h2>
        </div>
        <button id="closeFormButton" class="icon-button" type="button"
                aria-label="Fechar">×</button>
      </div>

      <label for="itemName">Nome do item</label>
      <input id="itemName" name="itemName" type="text" maxlength="100" required>

      <label for="quantity">Quantidade disponível</label>
      <input id="quantity" name="quantity" type="number" min="0" step="0.01" required>

      <label for="unit">Unidade</label>
      <select id="unit" name="unit" required>
        <option value="un">Unidade (un)</option>
        <option value="L">Litro (L)</option>
        <option value="kg">Quilograma (kg)</option>
        <option value="m">Metro (m)</option>
        <option value="kit">Kit</option>
      </select>

      <label for="minimum">Quantidade mínima</label>
      <input id="minimum" name="minimum" type="number" min="0" step="0.01" value="0" required>

      <label for="unitCost">Custo por unidade (R$)</label>
      <input id="unitCost" name="unitCost" type="number" min="0" step="0.01" value="0" required>

      <p id="formError" class="error-message" role="alert"></p>

      <div class="dialog-actions">
        <button id="cancelFormButton" class="secondary-button" type="button">
          Cancelar
        </button>
        <button class="primary-button" type="submit">Salvar item</button>
      </div>
    </form>
  </dialog>
</body>
</html>
