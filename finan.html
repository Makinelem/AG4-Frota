<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Financeiro | Frota AG4</title>
  <link rel="stylesheet" href="css/veic.css">
  <link rel="stylesheet" href="css/finan.css">
  <script src="js/finan.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="app-brand" href="app.html" aria-label="Frota AG4 - Início">
      <img src="img/logo.png" alt="Frota AG4" class="app-logo">
    </a>
    <div class="user-area">
      <span id="userInfo"></span>
      <button id="logoutButton" class="logout-button" type="button">Sair</button>
    </div>
  </header>

  <main class="content">
    <div class="page-heading">
      <div>
        <p class="eyebrow">GESTÃO DA FROTA</p>
        <h1>Financeiro</h1>
        <p class="subtitle">Registre receitas e despesas da frota.</p>
      </div>
      <button id="openFormButton" class="primary-button" type="button">
        + Novo lançamento
      </button>
    </div>

    <section class="finance-summary" aria-label="Resumo financeiro">
      <article class="summary-card">
        <span>Receitas</span>
        <strong id="incomeTotal">R$ 0,00</strong>
      </article>
      <article class="summary-card">
        <span>Despesas</span>
        <strong id="expenseTotal">R$ 0,00</strong>
      </article>
      <article class="summary-card">
        <span>Saldo</span>
        <strong id="balanceTotal">R$ 0,00</strong>
      </article>
    </section>

    <p id="feedback" class="feedback" role="status"></p>
    <section id="financeList" class="vehicle-list" aria-label="Lançamentos financeiros"></section>
    <p id="emptyMessage" class="empty-message" hidden>Nenhum lançamento cadastrado.</p>
  </main>

  <nav class="bottom-nav" id="bottomNav" aria-label="Navegação principal"></nav>

  <dialog id="financeDialog" class="dialog">
    <form id="financeForm" class="dialog-card">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">FROTA AG4</p>
          <h2>Novo lançamento</h2>
        </div>
        <button id="closeFormButton" class="icon-button" type="button" aria-label="Fechar">×</button>
      </div>

      <label for="type">Tipo</label>
      <select id="type" name="type" required>
        <option value="Despesa">Despesa</option>
        <option value="Receita">Receita</option>
      </select>

      <label for="date">Data</label>
      <input id="date" name="date" type="date" required>

      <label for="description">Descrição</label>
      <input id="description" name="description" type="text" maxlength="150" required>

      <label for="category">Categoria</label>
      <input id="category" name="category" type="text" maxlength="80" placeholder="Ex.: combustível, manutenção">

      <label for="amount">Valor (R$)</label>
      <input id="amount" name="amount" type="number" min="0.01" step="0.01" required>

      <p id="formError" class="error-message" role="alert"></p>

      <div class="dialog-actions">
        <button id="cancelFormButton" class="secondary-button" type="button">Cancelar</button>
        <button class="primary-button" type="submit">Salvar lançamento</button>
      </div>
    </form>
  </dialog>
</body>
</html>
